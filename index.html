<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>analog clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
    <nav>
        <div>Classic<br><span>Minimal</span></div>
        <div>Modern<br><span>Bold/dark</span></div>
        <div>Vintage<br><span>Retro</span></div>
        <div>Scandi<br><span>Natural wood</span></div>
    </nav>
    </div>
    <main>
    <div class="clock">
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="date"></div>
    <div class="center"></div>
    </div>
    <section class="digital-time">
        <div class="ball"></div>
        <div class="digtime"></div>
        <div class="day"></div>
    </section>
    <section class="weather">
        <div class="temperature"></div>
        <div class="humidity"></div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
